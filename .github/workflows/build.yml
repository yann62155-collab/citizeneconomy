name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compiler le mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: citizeneconomy-jar
          path: build/libs/*.jar
      - name: Publier une Release avec le .jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Citizen Economy build ${{ github.run_number }}
          files: build/libs/*.jar
